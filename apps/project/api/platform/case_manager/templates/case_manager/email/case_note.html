{% load i18n %}<!DOCTYPE html>
{% comment %}
  Aviso institucional de una novedad del expediente.

  Tres cosas que no son de gusto:

  1. **Estilos en linea, y tablas para la rejilla.** Gmail borra el `<style>`
     del `<head>` y Outlook renderiza con el motor de Word, que no entiende
     flexbox ni grid. Lo que aqui parece anticuado es lo unico que se ve
     igual en los dos.

  2. **Las imagenes van con `cid:`**, no con una URL. Casi todos los clientes
     de correo bloquean las imagenes remotas por defecto --son el metodo de
     siempre para saber si alguien abrio el mensaje--, asi que un membrete
     enlazado sale como un cuadro roto. Estas viajan dentro del correo; las
     adjunta `emails.py`.

  3. **Cada imagen lleva su `alt`.** Si alguna falla igualmente, lo que queda
     es una palabra y no un hueco.
{% endcomment %}
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ note.title }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#212529;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e3e7eb;">

          <tr>
            <td align="center" style="padding:28px 24px 16px;">
              <img src="cid:membrete" width="150" alt="Propensiones® Abogados Internacional"
                   style="display:block;width:150px;max-width:60%;height:auto;border:0;">
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px;">
              <div style="height:1px;background-color:#e3e7eb;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 8px;">
              <p style="margin:0 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6f7b86;">
                {{ note.get_kind_display }}
              </p>
              <h1 style="margin:0;font-size:20px;line-height:1.3;color:#071d35;">{{ note.title }}</h1>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 0;">
              <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                {% blocktrans with name=client.full_name %}Dear {{ name }},{% endblocktrans %}
              </p>
              <div style="font-size:15px;line-height:1.55;">
                {{ note.body|linebreaks }}
              </div>
            </td>
          </tr>

          {% if note.needs_client_action %}
            {% comment %}
              La unica nota que le pide algo al cliente se separa del resto.
              Una peticion perdida entre avisos es una peticion que no se
              atiende.
            {% endcomment %}
            <tr>
              <td style="padding:8px 32px 0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                       style="background-color:#fdf2f2;border-left:4px solid #c0392b;border-radius:4px;">
                  <tr>
                    <td style="padding:14px 16px;font-size:14px;line-height:1.5;color:#7b241c;">
                      <strong>{% trans "This message needs something from you." %}</strong><br>
                      {% blocktrans %}Reply to this email attaching what is requested, or write to the address below.{% endblocktrans %}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          {% endif %}

          <tr>
            <td style="padding:24px 32px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                     style="background-color:#f7f9fb;border-radius:6px;">
                <tr>
                  <td style="padding:14px 16px;font-size:13px;line-height:1.6;color:#4b5b6b;">
                    <strong style="color:#071d35;">{% trans "Your case" %}</strong><br>
                    {% trans "Service" %}: {{ case.get_service_display }}<br>
                    {% if case.public_reference != "—" %}
                      {% trans "Case number" %}: {{ case.public_reference }}<br>
                    {% endif %}
                    {% trans "Current status" %}: {{ case.get_stage_display }}
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 0;font-size:14px;line-height:1.5;">
              <p style="margin:0 0 4px;font-style:italic;">{% trans "Kind regards," %}</p>
              <img src="cid:firma" width="170" alt="Jorge Uriel Vega Londoño"
                   style="display:block;width:170px;max-width:70%;height:auto;border:0;margin:4px 0 -6px -4px;">
              <p style="margin:0;font-weight:bold;">Jorge Uriel Vega Londoño</p>
              <p style="margin:0;color:#4b5b6b;">{% trans "Legal representative" %}</p>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 28px;">
              <div style="height:1px;background-color:#e3e7eb;margin-bottom:14px;"></div>
              <p style="margin:0 0 6px;font-size:12px;line-height:1.5;color:#6f7b86;">
                {% blocktrans %}To reply to this message, write to{% endblocktrans %}
                <a href="mailto:{{ reply_to }}" style="color:#2957A4;">{{ reply_to }}</a>
                &middot; +57 301 228 3818
              </p>
              <p style="margin:0;font-size:11px;line-height:1.5;color:#8b97a3;">
                {% blocktrans %}This message and the information it contains are confidential and intended for its addressee. The processing of personal data follows Law 1581 of 2012.{% endblocktrans %}<br>
                Propensiones&reg; Abogados Internacional &middot; NIT 901.409.813-7 &middot; {{ year }}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
