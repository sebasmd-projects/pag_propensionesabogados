{% load i18n %}<!DOCTYPE html>
{% comment %}
  El correo con el enlace para fijar una clave nueva.

  Mismo maquetado que el del codigo de acceso (`utils/email/otp_email.html`):
  tablas y estilos en linea porque Gmail borra el `<style>` y Outlook renderiza
  con el motor de Word, y el membrete por `cid:` porque casi todos los clientes
  bloquean las imagenes remotas. Lo adjunta `emails.py`.

  El enlace va dos veces: como boton y escrito en un parrafo. El segundo es el
  que sobrevive en la version en texto plano, que se deriva de este HTML.
{% endcomment %}
<html lang="{{ LANGUAGE_CODE|default:'es' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Reset your password" %}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f8;font-family:Arial,Helvetica,sans-serif;color:#212529;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0"
               style="max-width:600px;width:100%;background-color:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e3e7eb;">

          <tr>
            <td align="center" style="padding:28px 24px 16px;">
              <img src="cid:membrete" width="150" alt="Propensiones® Abogados Internacional"
                   style="display:block;width:150px;max-width:60%;height:auto;border:0;">
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px;">
              <div style="height:1px;background-color:#e3e7eb;"></div>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 8px;">
              <h1 style="margin:0;font-size:20px;line-height:1.3;color:#071d35;">
                {% trans "Reset your password" %}
              </h1>
            </td>
          </tr>

          <tr>
            <td style="padding:8px 32px 0;">
              <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                {% blocktrans %}Dear {{ name }},{% endblocktrans %}
              </p>
              <p style="margin:0 0 16px;font-size:15px;line-height:1.5;">
                {% trans "We received a request to set a new password for your account. Use the button below to choose it." %}
              </p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:8px 32px 0;">
              <a href="{{ reset_url }}" target="_blank" rel="noopener noreferrer"
                 style="display:inline-block;padding:14px 28px;background-color:#071d35;color:#ffffff;
                        font-size:16px;font-weight:bold;text-decoration:none;border-radius:8px;">
                {% trans "Choose a new password" %}
              </a>
            </td>
          </tr>

          <tr>
            <td style="padding:16px 32px 0;">
              <p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#6f7b86;">
                {% blocktrans %}The link expires in {{ minutes }} minutes and can only be used once.{% endblocktrans %}
              </p>
              <p style="margin:0 0 16px;font-size:13px;line-height:1.5;color:#6f7b86;word-break:break-all;">
                {% trans "If the button does not work, copy this address into your browser:" %}
                {{ reset_url }}
              </p>
            </td>
          </tr>

          <tr>
            <td style="padding:0 32px 8px;">
              <div style="padding:14px 16px;background-color:#fff8e6;border:1px solid #f3e0a9;border-radius:8px;">
                <p style="margin:0;font-size:14px;line-height:1.5;color:#6b5400;">
                  {% blocktrans %}If you did not ask for this, ignore this message: your password will not change. Nobody at Propensiones® will ever ask you for this link. If you are worried, write to {{ contact_email }}.{% endblocktrans %}
                </p>
              </div>
            </td>
          </tr>

          <tr>
            <td style="padding:24px 32px 28px;">
              <div style="height:1px;background-color:#e3e7eb;margin-bottom:16px;"></div>
              <p style="margin:0;font-size:12px;line-height:1.5;color:#6f7b86;">
                &copy; {{ year }} Propensiones&reg; Abogados Internacional.
                {% trans "This message was sent automatically. If you reply, it will reach our management office." %}
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
